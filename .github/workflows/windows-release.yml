name: Build Windows Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build portable Windows package
        run: npm run package:win:zip

      - name: Build source package
        run: npm run package:source

      - name: Build Windows installer
        run: npm run package:win:installer

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: XiaofangAssistant-Windows-x64
          path: |
            release/XiaofangAssistant-win32-x64.zip
            release/XiaofangAssistant-source-v*.zip
            release/installer/*.exe

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release/XiaofangAssistant-win32-x64.zip
            release/XiaofangAssistant-source-v*.zip
            release/installer/*.exe
